name: Publish Downstream Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag in vX.Y.Z format'
        required: true
        type: string
        default: 'v0.27.3'
      publish_latest:
        description: 'Also update the latest image tag'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: downstream-docker-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate downstream release
    runs-on: ubuntu-latest
    outputs:
      git_ref: ${{ steps.release.outputs.git_ref }}
      app_version: ${{ steps.release.outputs.app_version }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
    steps:
      - id: release
        name: Validate tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          REQUESTED_LATEST: ${{ inputs.publish_latest || false }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vX.Y.Z" >&2
            exit 1
          fi

          app_version=${REQUESTED_TAG#v}
          echo "git_ref=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$app_version" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$REQUESTED_LATEST" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build web
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}
      - name: Setup version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - name: Build web
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: stable
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: packages/frontend/apps/web/dist
          if-no-files-found: error

  build-admin:
    name: Build admin
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}
      - name: Setup version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - name: Build admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: stable
      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin
          path: packages/frontend/admin/dist
          if-no-files-found: error

  build-mobile:
    name: Build mobile
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}
      - name: Setup version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - name: Build mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: stable
      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: packages/frontend/apps/mobile/dist
          if-no-files-found: error

  build-server-native:
    name: Build server native (${{ matrix.target.name }})
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64-unknown-linux-gnu
            file: server-native.x64.node
          - name: aarch64-unknown-linux-gnu
            file: server-native.arm64.node
          - name: armv7-unknown-linux-gnueabihf
            file: server-native.armv7.node
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}
      - name: Setup version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: 'workspaces focus @affine/server-native'
      - name: Build Rust
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.target.name }}
          package: '@affine/server-native'
      - name: Rename native module
        shell: bash
        run: mv packages/backend/native/server-native.node packages/backend/native/${{ matrix.target.file }}
      - name: Upload native module
        uses: actions/upload-artifact@v4
        with:
          name: server-native-${{ matrix.target.file }}
          path: packages/backend/native/${{ matrix.target.file }}
          if-no-files-found: error

  build-server:
    name: Build server
    needs:
      - prepare
      - build-server-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}
      - name: Setup version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: 'workspaces focus @affine/server @types/affine__env'
      - name: Download native modules
        uses: actions/download-artifact@v4
        with:
          pattern: server-native-*
          merge-multiple: true
          path: packages/backend/native
      - name: Build server
        run: yarn workspace @affine/server build
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: packages/backend/server/dist
          if-no-files-found: error

  publish:
    name: Publish Docker image
    needs:
      - prepare
      - build-web
      - build-admin
      - build-mobile
      - build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}
      - name: Download server artifact
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: packages/backend/server/dist
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: packages/frontend/apps/web/dist
      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin
          path: packages/frontend/admin/dist
      - name: Download mobile artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile
          path: packages/frontend/apps/mobile/dist
      - name: Setup version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          package-install: false
      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64", "arm64", "arm"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production
          yarn workspace @affine/server prisma generate
          mv node_modules packages/backend/server
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: image-tags
        name: Determine image tags
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.image_tag }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          {
            echo 'tags<<EOF'
            echo "ghcr.io/dalamudx/affine:${TAG}"
            if [[ "$PUBLISH_LATEST" == 'true' ]]; then
              echo 'ghcr.io/dalamudx/affine:latest'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: true
          tags: ${{ steps.image-tags.outputs.tags }}
